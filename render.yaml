services:
  - type: web
    name: ledgerwatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_KEY
        value: demo-key-123
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerwatch-db
          property: connectionString
      - key: MODEL_PATH
        value: saved_models/isolation_forest_v1.0.0.joblib
      - key: RISK_ENGINE_PATH
        value: saved_models/risk_engine_v1.0.0.joblib
      - key: OCR_MOCK_MODE
        value: "false"
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: ledgerwatch-db
    plan: free
    ipAllowList: []
