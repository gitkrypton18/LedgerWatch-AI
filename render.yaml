services:
  - type: web
    name: ledgerwatch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./ledgerwatch.db
      - key: MODEL_PATH
        value: saved_models/isolation_forest_v1.0.0.joblib  # ✅ FIXED
      - key: RISK_ENGINE_PATH
        value: saved_models/risk_engine_v1.0.0.joblib      # ✅ ADDED
    healthCheckPath: /health
    autoDeploy: true
