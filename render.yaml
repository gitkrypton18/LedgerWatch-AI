services:
  - type: web
    name: ledgerwatch-api
    runtime: python
    plan: free  # ✅ Tesseract works on free tier (~100MB RAM)
    buildCommand: |
    apt-get update -qq
    apt-get install -y -qq tesseract-ocr tesseract-ocr-eng poppler-utils
    which tesseract          # ✅ Verify binary exists
    tesseract --version      # ✅ Verify version
    pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_KEY
        value: demo-key-123
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerwatch-db
          property: connectionString
      - key: MODEL_PATH
        value: saved_models/isolation_forest.joblib
      - key: RISK_ENGINE_PATH
        value: saved_models/risk_engine.joblib
      - key: OCR_MOCK_MODE
        value: "false"  # ✅ Real Tesseract OCR
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: ledgerwatch-db
    plan: free
    ipAllowList: []
